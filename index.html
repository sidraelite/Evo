<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVOTO Ultra | Professional AI Studio</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Evoto Ultra Studio","short_name":"EvotoUltra","display":"standalone","background_color":"#050505","theme_color":"#3b82f6","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/1837/1837526.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1837/1837526.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/index.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #3b82f6; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { width: 340px; border-right: 1px solid #1a1a1a; overflow-y: auto; }
        canvas { max-width: 90%; max-height: 80%; border-radius: 12px; box-shadow: 0 50px 100px rgba(0,0,0,0.9); transition: opacity 0.1s; }
        .custom-modal { display: none; background: rgba(0,0,0,0.95); backdrop-filter: blur(30px); z-index: 10000; }
        #toast { bottom: 30px; right: 30px; transform: translateY(250%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 11000; }
        #toast.active { transform: translateY(0); }
        .tool-active { border-color: var(--accent) !important; background: rgba(59, 130, 246, 0.1) !important; color: white !important; }
        input[type="range"] { accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body class="flex flex-col">

    <div id="toast" class="fixed glass p-6 rounded-[2rem] flex items-center gap-5 border-l-4 border-l-blue-600 shadow-2xl">
        <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-xl italic text-white">U</div>
        <div>
            <p id="toastTitle" class="text-[10px] font-black uppercase text-blue-500 tracking-widest">Neural System</p>
            <p id="toastMsg" class="text-xs text-gray-300 font-bold"></p>
        </div>
    </div>

    <div id="mainModal" class="custom-modal fixed inset-0 flex items-center justify-center p-6">
        <div class="glass max-w-xl w-full rounded-[3.5rem] p-12 text-center border-white/10">
            <div id="loginView">
                <h1 class="text-6xl font-black italic mb-3 tracking-tighter">EVOTO <span class="text-blue-600">ULTRA</span></h1>
                <p class="text-gray-500 text-[10px] font-black uppercase tracking-[0.6em] mb-12">Professional AI Studio</p>
                <input type="tel" id="userPhone" placeholder="Phone ID (+234...)" class="w-full p-7 bg-white/5 border border-white/10 rounded-3xl mb-8 text-center text-2xl outline-none focus:border-blue-600 transition-all font-bold tracking-tight">
                <button onclick="login()" class="w-full bg-blue-600 p-7 rounded-3xl font-black uppercase tracking-widest hover:bg-blue-500 transition shadow-2xl shadow-blue-600/40">Enter Studio</button>
                <div class="mt-12 flex flex-wrap justify-center gap-8 text-[10px] text-gray-600 font-black uppercase tracking-widest">
                    <button onclick="showDoc('about')">About</button>
                    <button onclick="showDoc('privacy')">Privacy</button>
                    <button onclick="showDoc('tos')">Terms</button>
                    <a href="https://wa.me/2347030151024" target="_blank" class="text-green-500 font-bold">Support Hub</a>
                </div>
            </div>
            <div id="docView" class="hidden text-left">
                <button onclick="showLogin()" class="text-blue-500 font-black uppercase text-[10px] mb-8 tracking-widest">← Back</button>
                <h2 id="docTitle" class="text-4xl font-black italic text-white mb-6 uppercase tracking-tighter"></h2>
                <div id="docContent" class="text-sm text-gray-400 space-y-4 h-80 overflow-y-auto pr-4 leading-relaxed font-light"></div>
            </div>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 bg-black/98 z-[9999] hidden flex-col items-center justify-center">
        <div class="w-20 h-20 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mb-8"></div>
        <p id="loadText" class="text-[10px] tracking-[1em] uppercase text-blue-500 font-black italic animate-pulse">Synchronizing Neural Core</p>
    </div>

    <nav class="h-24 px-12 glass flex items-center justify-between z-50 border-x-0 border-t-0">
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-4xl italic shadow-2xl shadow-blue-600/30">U</div>
            <div class="leading-none">
                <span class="font-black text-3xl uppercase tracking-tighter block">EVOTO ULTRA</span>
                <span id="userStatus" class="text-[10px] text-blue-400 font-black uppercase tracking-[0.4em]">Ready</span>
            </div>
        </div>
        <div class="flex items-center gap-10">
            <button id="compareBtn" class="px-10 py-4 rounded-2xl text-[10px] font-black border border-white/10 glass hover:bg-white/5 transition uppercase tracking-[0.3em]">Hold Compare</button>
            <button onclick="tryExport()" class="bg-blue-600 px-12 py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.3em] shadow-2xl shadow-blue-600/40 active:scale-90 transition">Save HD (-1 Credit)</button>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        <aside class="sidebar p-10 flex flex-col glass border-y-0 border-l-0">
            <div class="p-8 bg-gradient-to-br from-blue-600/20 via-transparent border border-blue-500/20 rounded-[3rem] mb-12 text-center">
                <p class="text-[10px] text-blue-400 font-black uppercase tracking-widest mb-4">Neural Vault</p>
                <h2 id="credCount" class="text-8xl font-black italic tracking-tighter">--</h2>
                <button onclick="pay()" class="mt-8 w-full bg-white text-black text-[10px] font-black py-5 rounded-3xl uppercase tracking-widest hover:bg-blue-600 hover:text-white transition shadow-xl">Recharge Vault</button>
            </div>

            <div class="space-y-12 pb-10">
                <div>
                    <p class="text-[11px] font-black text-gray-700 uppercase mb-6 tracking-widest border-b border-white/5 pb-2">AI Portrait Engine</p>
                    <button onclick="applySkin()" class="w-full text-left p-7 bg-white/5 rounded-[2.5rem] border border-white/5 hover:border-blue-600 transition flex items-center gap-7 mb-4 group">
                        <span class="text-3xl group-hover:scale-125 transition">✨</span> <span class="text-[11px] font-black uppercase tracking-widest">Skin Smoothing</span>
                    </button>
                    <button onclick="applyMesh()" class="w-full text-left p-7 bg-white/5 rounded-[2.5rem] border border-white/5 hover:border-blue-600 transition flex items-center gap-7 group">
                        <span class="text-3xl group-hover:scale-125 transition">🎯</span> <span class="text-[11px] font-black uppercase tracking-widest">468 Face Mesh</span>
                    </button>
                </div>

                <div>
                    <p class="text-[11px] font-black text-gray-700 uppercase mb-6 tracking-widest border-b border-white/5 pb-2">Sculpt & Structure</p>
                    <button onclick="applyBG()" class="w-full text-left p-7 bg-blue-600/10 rounded-[2.5rem] border border-blue-500/20 hover:border-blue-600 transition flex items-center gap-7 mb-4 group text-blue-400">
                        <span class="text-3xl group-hover:scale-125 transition">✂️</span> <span class="text-[11px] font-black uppercase tracking-widest">Remove BG</span>
                    </button>
                    <button id="liqBtn" onclick="toggleLiq()" class="w-full text-left p-7 bg-white/5 rounded-[2.5rem] border border-white/5 hover:border-blue-600 transition flex items-center gap-7 mb-8 group">
                        <span class="text-3xl group-hover:scale-125 transition">💪</span> <span class="text-[11px] font-black uppercase tracking-widest">Body Sculpt</span>
                    </button>
                    <div class="px-4">
                        <div class="flex justify-between text-[11px] text-gray-600 font-black mb-4 uppercase tracking-widest"><span>Sculpt Radius</span><span id="brushVal">80px</span></div>
                        <input type="range" id="brushSize" min="30" max="350" value="80" class="w-full" oninput="brushVal.innerText=this.value+'px'">
                    </div>
                </div>

                <input type="file" id="batchInp" class="hidden" multiple accept="image/*">
                <button onclick="document.getElementById('batchInp').click()" class="w-full p-12 border-2 border-dashed border-white/10 rounded-[3.5rem] text-[10px] text-gray-600 font-black uppercase tracking-[0.4em] hover:border-blue-600 hover:text-white transition">Batch Asset Import</button>
                
                <a href="https://wa.me/2347030151024" target="_blank" class="flex items-center justify-center p-7 bg-green-600/10 rounded-[2.5rem] text-[10px] font-black text-green-500 border border-green-600/20 uppercase tracking-widest hover:bg-green-600 hover:text-white transition shadow-xl">
                   WhatsApp Support
                </a>
            </div>
        </aside>

        <main class="flex-1 flex items-center justify-center p-20 relative bg-[#010101]">
            <canvas id="mainCanvas"></canvas>
            <div id="noImg" class="text-center opacity-10 pointer-events-none select-none">
                <h1 class="text-[200px] font-black italic tracking-tighter leading-none">ULTRA</h1>
                <p class="tracking-[3em] text-xs font-black text-blue-600 uppercase ml-[3em]">Professional Workspace</p>
            </div>
        </main>
    </div>

    <script>
        // --- MASTER SYSTEM CONFIG ---
        const API = "https://script.google.com/macros/s/AKfycbwW6MhfOik34h759qsWqqn40JupmltZsRXvDHYF37SpzbtyWIZsDCflrBa0aCMmS-_yvQ/exec"; 
        const PAY_KEY = "YOUR_PAYSTACK_PUBLIC_KEY"; 
        
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
        let currentImg = null, originalImg = null, isLiq = false;
        let phone = localStorage.getItem('ultra_phone');

        window.onload = () => { if(!phone) showLogin(); else { fetchCredits(); document.getElementById('userStatus').innerText = "ID: " + phone; } };

        function notify(title, msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 5000);
        }

        async function login() {
            const p = document.getElementById('userPhone').value;
            if(p.length < 10) return notify("Auth Error", "Invalid Phone ID.");
            setLoad(true, "Verifying Identity...");
            const res = await fetch(API, {method:'POST', body:JSON.stringify({action:'login', phone:p})});
            localStorage.setItem('ultra_phone', p);
            location.reload();
        }

        async function fetchCredits() {
            const res = await fetch(API, {method:'POST', body:JSON.stringify({action:'login', phone:phone})});
            const data = await res.json();
            document.getElementById('credCount').innerText = data.credits;
        }

        function pay() {
            let h = PaystackPop.setup({
                key: PAY_KEY, email: 'billing@evotoultra.com', amount: 100000,
                callback: async (r) => {
                    setLoad(true, "Updating Vault...");
                    await fetch(API, {method:'POST', body:JSON.stringify({action:'verify', phone:phone, reference:r.reference})});
                    location.reload();
                }
            });
            h.openIframe();
        }

        async function tryExport() {
            if(!currentImg) return notify("Export Warning", "No image in workspace.");
            setLoad(true, "Authenticating Export...");
            const res = await fetch(API, {method:'POST', body:JSON.stringify({action:'deduct', phone:phone})});
            const data = await res.json();
            if(data.status === 'success') {
                const link = document.createElement('a');
                link.download = 'Evoto_Ultra_Export.png'; link.href = canvas.toDataURL('image/png', 1.0); link.click();
                fetchCredits();
                notify("Success", "HD Image saved.");
            } else notify("Credit Error", "Vault empty. Recharge to export.");
            setLoad(false);
        }

        // --- AI FEATURES (ZERO OMISSIONS) ---
        document.getElementById('batchInp').onchange = (e) => {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = (ev) => {
                const i = new Image();
                i.onload = () => {
                    currentImg = i; originalImg = i;
                    canvas.width = i.width; canvas.height = i.height;
                    ctx.drawImage(i, 0, 0);
                    document.getElementById('noImg').style.display='none';
                    notify("Asset Loaded", "Neural layers initialized.");
                };
                i.src = ev.target.result;
            };
            r.readAsDataURL(f);
        };

        const compareBtn = document.getElementById('compareBtn');
        compareBtn.onmousedown = () => { if(originalImg) { canvas.style.opacity = '0.3'; ctx.drawImage(originalImg, 0, 0); } };
        compareBtn.onmouseup = () => { if(currentImg) { canvas.style.opacity = '1'; ctx.drawImage(canvas, 0, 0); } };

        async function applyBG() {
            setLoad(true, "Analyzing Background...");
            const b = await imglyRemoveBackground(canvas);
            const i = new Image(); i.src = URL.createObjectURL(b);
            i.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(i,0,0); setLoad(false); notify("AI Task", "Background removed."); };
        }

        async function applyMesh() {
            setLoad(true, "Mapping 468 Landmarks...");
            const fm = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
            fm.setOptions({maxNumFaces:1, refineLandmarks:true});
            fm.onResults(r => {
                if(r.multiFaceLandmarks) r.multiFaceLandmarks[0].forEach(p => {
                    ctx.fillStyle="#3b82f6"; ctx.fillRect(p.x*canvas.width, p.y*canvas.height, 1, 1);
                });
                setLoad(false); notify("AI Task", "Face mesh applied.");
            });
            await fm.send({image:canvas});
        }

        function toggleLiq() { 
            isLiq = !isLiq; 
            document.getElementById('liqBtn').classList.toggle('tool-active');
            notify("Tool State", isLiq ? "Sculpting active." : "Sculpting disabled.");
        }

        canvas.onmousedown = () => {
            if(!isLiq) return;
            canvas.onmousemove = (e) => {
                const r = canvas.getBoundingClientRect();
                const x = (e.clientX - r.left) * (canvas.width / r.width);
                const y = (e.clientY - r.top) * (canvas.height / r.height);
                const s = parseInt(document.getElementById('brushSize').value);
                ctx.save(); ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.clip();
                ctx.drawImage(canvas, x-s-1, y-s-1, s*2, s*2, x-s, y-s, s*2, s*2);
                ctx.restore();
            };
        };
        window.onmouseup = () => canvas.onmousemove = null;

        function applySkin() {
            ctx.globalAlpha = 0.28; ctx.filter = 'blur(7px) saturate(1.1)';
            ctx.drawImage(canvas,0,0); ctx.filter='none'; ctx.globalAlpha=1;
            notify("AI Task", "Skin texture smoothed.");
        }

        function showLogin() { 
            document.getElementById('mainModal').style.display = 'flex'; 
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('docView').classList.add('hidden');
        }
        function showDoc(type) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('docView').classList.remove('hidden');
            const docs = {
                about: "EVOTO Ultra is a high-performance AI photo studio. We specialize in on-device neural processing including 468-point facial mapping and body sculpting. Support: +2347030151024.",
                privacy: "All image processing is local to your device. We do not store photos. Only your credit balance and phone ID are stored in our secure vault.",
                tos: "Credits are for HD exports. All sales are final. Use of this studio signifies agreement to our data local-processing policy. Support available via WhatsApp."
            };
            document.getElementById('docTitle').innerText = type;
            document.getElementById('docContent').innerText = docs[type];
        }
        function setLoad(s, t) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; document.getElementById('loadText').innerText = t; }
    </script>
</body>
</html>
